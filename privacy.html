<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ClassChase – Privacy Policy</title>
    <meta name="description" content="Privacy Policy for ClassChase." />
    <link rel="stylesheet" href="styles.css" />
    <style>
        .terms-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            max-width: 680px;
            padding: 70px 0 100px;
            gap: 0;
        }
        .terms-wrap .terms-h1,
        .terms-wrap .terms-date,
        .terms-wrap .terms-h2,
        .terms-wrap .terms-h3,
        .terms-wrap .terms-p {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.1em;
            color: var(--gray-sub);
        }
        .terms-h1 { margin-bottom: 4px; }
        .terms-date { margin-bottom: 36px; }
        .terms-h2 { margin-top: 32px; margin-bottom: 8px; }
        .terms-h3 { margin-top: 20px; margin-bottom: 6px; }
        .terms-p { margin-bottom: 12px; }
        .terms-p a {
            color: var(--gray-sub);
            text-decoration: underline;
        }
        .terms-p a:hover { color: #09f; }

        @media (max-width: 809px) {
            .terms-wrap { padding: 90px 0 60px; }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <div class="nav-wrap">
        <nav>
            <a href="/" class="nav-logo">ClassChase</a>
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
    </div>

    <div class="outer">
        <div class="inner">
            <div class="terms-wrap">

                <div class="terms-h1">Privacy Policy</div>
                <div class="terms-date">Last updated: June 06, 2026</div>

            </div>
        </div>
    </div><!-- /outer -->

</body>

</html>
