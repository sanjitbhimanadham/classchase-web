<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ClassChase</title>
    <meta name="description" content="About" />
    <link rel="icon" href="/images/icon.png" type="image/png" />
    <meta property="og:site_name" content="ClassChase" />
    <meta property="og:image" content="https://www.classchase.app/images/banner.png?v=1" />
    <meta property="og:title" content="ClassChase" />
    <meta property="og:description"
        content="Never miss an open seat—ClassChase helps Texas A&M students track classes in real time. Available on iOS & Android." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClassChase" />
    <meta name="twitter:description"
        content="Never miss an open seat—ClassChase helps Texas A&M students track classes in real time. Available on iOS & Android." />
    <meta name="twitter:image" content="https://www.classchase.app/images/banner.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
        .about-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 960px;
            padding: 70px 0 80px;
        }

        .about-hero-h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1em;
            text-align: center;
            color: var(--black);
            width: 100%;
            margin: 0;
        }

        .about-hero-p {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.2em;
            text-align: left;
            color: var(--gray-sub);
            max-width: 550px;
            margin: 0;
        }

        @media (max-width: 809px) {
            .about-hero {
                padding: 90px 0 40px;
            }

            .about-hero-h1 {
                font-size: 26px;
            }

            .about-hero-p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <div class="nav-wrap">
        <nav>
            <a href="/" class="nav-logo">ClassChase</a>
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="https://discord.gg/rjBmmDZYCS" target="_blank" rel="noopener noreferrer">Discord</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
    </div>

    <div class="outer">

        <!-- HERO -->
        <div class="inner" style="display:flex;justify-content:center;">
            <div class="about-hero">
                <div class="about-hero-h1">About</div>
                <p class="about-hero-p">ClassChase helps Texas A&M students track class availability in real time and
                    get notified the instant a seat opens up. The app continuously monitors enrollment changes so you
                    can secure the classes you need.<br><br>ClassChase started in December 2025.</p>
            </div>
        </div>

    </div><!-- /outer -->
</body>

</html>
