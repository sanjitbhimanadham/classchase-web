<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ClassChase</title>
    <meta name="description" content="Get help with ClassChase." />
    <link rel="stylesheet" href="../styles.css" />
    <style>
        .support-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 960px;
            padding: 70px 0 80px;
        }
        .support-hero-h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1em;
            text-align: center;
            color: var(--black);
            width: 100%;
        }
        .support-hero-p {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.1em;
            text-align: center;
            color: var(--black);
        }
        .support-hero-p a {
            color: var(--black);
            text-decoration: none;
        }
        .support-hero-p a:hover {
            color: #09f;
            text-decoration: underline;
        }

        @media (max-width: 809px) {
            .support-hero { padding: 90px 0 40px; }
            .support-hero-h1 { font-size: 26px; }
            .support-hero-p { font-size: 15px; }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <div class="nav-wrap">
        <nav>
            <a href="/" class="nav-logo">ClassChase</a>
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="../about/index.html">About</a></li>
            </ul>
        </nav>
    </div>

    <div class="outer">

        <!-- HERO -->
        <div class="inner" style="display:flex;justify-content:center;">
            <div class="support-hero">
                <div class="support-hero-h1">Support</div>
                <p class="support-hero-p">Send an email to <a href="mailto:support@classchase.app">support@classchase.app</a>.</p>
            </div>
        </div>

    </div><!-- /outer -->
</body>

</html>
