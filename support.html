<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ClassChase</title>
    <meta name="description" content="Support" />
    <link rel="icon" href="/images/icon.png" type="image/png" />
    <meta property="og:site_name" content="ClassChase" />
    <meta property="og:image" content="https://www.classchase.app/images/banner.png?v=1" />
    <meta property="og:title" content="ClassChase" />
    <meta property="og:description"
        content="Never miss an open seat—ClassChase helps Texas A&M students track classes in real time. Available on iOS & Android." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClassChase" />
    <meta name="twitter:description"
        content="Never miss an open seat—ClassChase helps Texas A&M students track classes in real time. Available on iOS & Android." />
    <meta name="twitter:image" content="https://www.classchase.app/images/banner.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
        .support-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 960px;
            padding: 70px 0 80px;
        }

        .support-hero-h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1em;
            text-align: center;
            color: var(--black);
            width: 100%;
        }

        .support-hero-p {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.1em;
            text-align: center;
            color: var(--black);
        }

        .support-hero-p a {
            color: var(--black);
            text-decoration: none;
        }

        .support-hero-p a:hover {
            color: #09f;
            text-decoration: underline;
        }

        @media (max-width: 809px) {
            .support-hero {
                padding: 90px 0 40px;
            }

            .support-hero-h1 {
                font-size: 26px;
            }

            .support-hero-p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <div class="nav-wrap">
        <nav>
            <a href="/" class="nav-logo">ClassChase</a>
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
    </div>

    <div class="outer">

        <!-- HERO -->
        <div class="inner" style="display:flex;justify-content:center;">
            <div class="support-hero">
                <div class="support-hero-h1">Support</div>
                <p class="support-hero-p">Send an email to <a
                        href="mailto:support@classchase.app">support@classchase.app</a>.</p>
            </div>
        </div>

    </div><!-- /outer -->
</body>

</html>
